<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Interactive 3D map of the Brockway Park disc golf course in Rosemount, MN, with the current layout and the 2027–2028 improvement plan.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%233e6a48'/%3E%3Cpath d='M9 13h14l-2 5H11z' fill='%23f2f4ee'/%3E%3Cpath d='M16 6v18' stroke='%23f2f4ee' stroke-width='2'/%3E%3C/svg%3E">
<style>body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}</style>
<title>Brockway Course Plan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-height planning tool — 3D site view on the left, a field-book panel on the right; stacks on phones. */
:root{
  --paper:#f2f4ee; --panel:#fbfcf8; --ink:#1c2720; --muted:#5d6b61; --rule:#d5dccf;
  --moss:#3e6a48; --signal:#d27a22; --tee-long:#2d5ea8; --tee-short:#c03f2c;
  --ok:#3e7d4f; --warn:#b5731b; --scene:#e6eadf;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111712; --panel:#171f19; --ink:#e2e8de; --muted:#93a196; --rule:#2c372f;
  --moss:#79a884; --signal:#e8943f; --tee-long:#6f9be0; --tee-short:#e9735f;
  --ok:#77b487; --warn:#e1a24f; --scene:#1a221c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111712; --panel:#171f19; --ink:#e2e8de; --muted:#93a196; --rule:#2c372f;
  --moss:#79a884; --signal:#e8943f; --tee-long:#6f9be0; --tee-short:#e9735f;
  --ok:#77b487; --warn:#e1a24f; --scene:#1a221c; color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;min-height:0}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  border-bottom:1px solid var(--rule);background:var(--panel)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:24px;letter-spacing:.02em;margin:0;text-transform:uppercase;text-wrap:balance}
.brand span{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.hdr-ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-left:auto}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
select,input[type=text],input[type=number],textarea{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:5px 8px}
textarea{width:100%;min-height:84px;resize:vertical}
input[type=number]{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:4px;padding:5px 10px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--moss)}
.btn.primary{background:var(--moss);border-color:var(--moss);color:var(--panel)}
.btn.danger{color:var(--tee-short)}
.btn[aria-pressed=true]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.laytabs{display:flex;gap:4px;flex-wrap:wrap}
.laytabs button{border:1px solid var(--rule);background:var(--paper);border-radius:4px;padding:5px 12px;cursor:pointer;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.laytabs button[aria-current=true]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.laytabs .ro{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:600;opacity:.75}
.locknote{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
.locknote b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.05em;font-size:14px}
.readnote{white-space:pre-wrap;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:8px 10px;font-size:13px;min-height:40px}
.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;min-height:0}
.stage{position:relative;min-height:0;background:var(--scene)}
#view{position:absolute;inset:0;touch-action:none}
.toolbar{position:absolute;top:10px;left:max(10px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 20px)}
.toolbar .grp{display:flex;background:var(--panel);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.toolbar .grp button{white-space:nowrap;border:0;border-right:1px solid var(--rule);background:transparent;padding:6px 10px;cursor:pointer;font-size:13px;font-weight:500}
.toolbar .grp button:last-child{border-right:0}
.toolbar .grp button:disabled{opacity:.4;cursor:default}
.toolbar .grp button[aria-pressed=true]{background:var(--ink);color:var(--panel)}
.legend{position:absolute;left:max(10px,env(safe-area-inset-left,0px));bottom:10px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:7px 10px;font-size:12px;display:flex;flex-wrap:wrap;gap:4px 14px;max-width:calc(100% - 20px)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hint{position:absolute;right:10px;bottom:10px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:6px 10px;font-size:12px;color:var(--muted);max-width:280px}
.status{position:absolute;right:10px;top:auto;bottom:56px;font-family:var(--f-mono);font-size:11.5px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:4px 8px}
.status.bad{color:var(--warn)}
@media (max-width:900px){.status{bottom:10px;left:10px;right:auto}}
.toolbar .grp{flex-wrap:wrap}
aside{border-left:1px solid var(--rule);background:var(--panel);display:grid;grid-template-rows:auto 1fr;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--rule)}
.tabs button{flex:1;border:0;background:transparent;padding:10px 4px;cursor:pointer;font-family:var(--f-display);font-size:16px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);border-bottom:2px solid transparent}
.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--signal)}
.pane{overflow:auto;padding:14px 16px 24px;min-width:0}
.pane h2{font-family:var(--f-display);font-size:20px;font-weight:600;margin:0 0 4px;text-transform:uppercase;letter-spacing:.03em}
.pane h3{font-family:var(--f-display);font-size:15px;font-weight:600;margin:18px 0 6px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.field{display:grid;gap:4px;margin-bottom:10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.row2 input,.row3 input,.field select{width:100%}
.stepper{display:flex;gap:4px}
.stepper input{flex:1;min-width:0}
.stepper button{width:30px;padding:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid var(--rule)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.empty{border:1px dashed var(--rule);border-radius:6px;padding:14px;color:var(--muted);font-size:13px}
.empty b{color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding:5px 4px;border-bottom:1px solid var(--rule)}
td{padding:6px 4px;border-bottom:1px solid var(--rule);font-family:var(--f-mono);font-variant-numeric:tabular-nums;vertical-align:top}
td.h{font-family:var(--f-display);font-size:17px;font-weight:700}
tr.click{cursor:pointer}
tr.click:hover td{background:color-mix(in srgb,var(--moss) 8%,transparent)}
.delta{font-size:11px;color:var(--muted)}
.delta.off{color:var(--warn)}
.tbl-wrap{overflow-x:auto}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:13px}
.change{border-left:3px solid var(--signal);padding:6px 10px;margin:0 0 8px;background:color-mix(in srgb,var(--signal) 6%,transparent);border-radius:0 4px 4px 0}
.change .t{font-weight:600}
.change .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.change .n{font-size:12.5px;margin-top:3px;white-space:pre-line}
.draftbox{border:1px solid var(--signal);border-radius:6px;padding:12px;margin-bottom:18px;background:color-mix(in srgb,var(--signal) 5%,transparent)}
.draftbox h2{font-size:18px}
.stepper #d-copybtn{width:auto;padding:0 12px}
.ghsteps{margin:10px 0 4px;padding-left:20px;font-size:13px;display:grid;gap:4px}
.ghsteps code{font-family:var(--f-mono);font-size:12px;overflow-wrap:anywhere}
.change{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:start}
.change>div{grid-column:1;min-width:0}
.change .rv{grid-column:2;grid-row:1 / span 3;padding:3px 9px;font-size:12px}
.change.clickable>div{cursor:pointer}
.totals{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px;margin-bottom:12px}
.totals b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
pre.summary{white-space:pre-wrap;font-family:var(--f-mono);font-size:12px;background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:10px;max-height:280px;overflow:auto}
.inline{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.readonly-note{font-size:12.5px;color:var(--warn);margin-bottom:10px}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:52px;background:var(--ink);color:var(--panel);padding:6px 12px;border-radius:4px;font-size:13px;pointer-events:none}
input[type=range]{width:100%;accent-color:var(--moss)}
@media (max-width:1100px){ .main{grid-template-columns:minmax(0,1fr) 320px} }
@media (max-width:900px){ .main{grid-template-columns:minmax(0,1fr) 280px} .legend{display:none} .tabs button{font-size:14px} }
@media (max-width:640px){
  .main{grid-template-columns:1fr;grid-template-rows:56vh auto}
  aside{border-left:0;border-top:1px solid var(--rule)}
  .hint{display:none}
  .app{height:auto;min-height:100%}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
body.public .locknote .inline:has(#unlockBtn),body.public #expBox,body.public .field:has(#gfile),body.public .row2:has(#g-cx),body.public .row2:has(#g-w){display:none!important}
.pubfoot{font-size:11.5px;color:var(--muted)}
.pubfoot a{color:inherit}
</style>

</head>
<body class="public">
<div class="app">
  <header>
    <div class="brand"><h1>Brockway Course Plan</h1><span>Brockway Park · Rosemount, MN · <span class="pubfoot">public view · <a href="https://github.com/amockenh/disc_golf" rel="noopener">about this map</a></span></span></div>
    <div class="hdr-ctl">
      <nav class="laytabs" id="layTabs" aria-label="Layouts"></nav>
      <button class="btn" id="newPropBtn" type="button">New proposal</button>
      <button class="btn danger" id="delPropBtn" type="button" hidden>Delete proposal</button>
      <button class="btn" id="openDraftBtn" type="button" hidden>Open draft file</button>
      <input type="file" id="openDraftFile" accept=".json,application/json" hidden>
    </div>
  </header>
  <div class="main">
    <div class="stage">
      <canvas id="view" aria-label="3D view of the course"></canvas>
      <div class="toolbar" role="toolbar" aria-label="Tools">
        <div class="grp" id="modeGrp">
          <button type="button" data-mode="select" aria-pressed="true">Select / move</button>
          <button type="button" data-mode="tee-long" aria-pressed="false">+ Long tee</button>
          <button type="button" data-mode="tee-short" aria-pressed="false">+ Short tee</button>
          <button type="button" data-mode="basket" aria-pressed="false">+ Basket</button>
          <button type="button" data-mode="grade" aria-pressed="false">+ Grade pt</button>
          <button type="button" data-mode="tree" aria-pressed="false">+ Tree</button>
        </div>
        <div class="grp">
          <button type="button" id="planBtn">Plan view</button>
          <button type="button" id="persBtn">3D view</button>
        </div>
        <div class="grp">
          <button type="button" id="undoBtn" title="Undo (Ctrl+Z)" disabled>Undo</button>
          <button type="button" id="redoBtn" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
        </div>
      </div>
      <div class="status" id="status">Connecting…</div>
      <div class="legend">
        <span><i style="background:var(--tee-long)"></i>Long (blue) tee</span>
        <span><i style="background:var(--tee-short)"></i>Short (red) tee</span>
        <span><i style="background:#e9e4d2;border:1px solid #888"></i>Basket</span>
        <span><i style="background:#e3b23c"></i>Grade point</span>
        <span><i style="background:#2f5b36"></i>Tree</span>
      </div>
      <div class="hint" id="hint">Drag to orbit · scroll to zoom · right-drag to pan. In a draft, drag a tee or basket to move it.</div>
      <div class="toast" id="toast" hidden></div>
    </div>
    <aside>
      <div class="tabs" role="tablist">
        <button role="tab" aria-selected="true" data-tab="inspect" id="tab-inspect">Inspect</button>
        <button role="tab" aria-selected="false" data-tab="holes" id="tab-holes">Holes</button>
        <button role="tab" aria-selected="false" data-tab="changes" id="tab-changes">Changes</button>
        <button role="tab" aria-selected="false" data-tab="site" id="tab-site">Site</button>
      </div>
      <div class="pane" id="pane"></div>
    </aside>
  </div>
</div>

<script>
(function(){
  "use strict";
  // Browser-side stand-in for the planner's data store.
  // Published data (data/course.json and merged proposals/*.json) is read-only;
  // drafts live in this browser's localStorage.
  const REPO="amockenh/disc_golf", BRANCH="main", DKEY="bw-drafts-v1";
  const KINDS=new Set(["tee-long","tee-short","basket","grade","tree"]);
  const store={features:{},layouts:{},ground:null};
  const listeners={features:[],layouts:[],ground:[]};
  let loaded=false, emitT=null, persistT=null;
  const snapDoc=(id,d)=>({id,exists:!!d,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}});
  const snapQ=docs=>({docs,size:docs.length,empty:!docs.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]});
  const qLayouts=()=>snapQ(Object.entries(store.layouts).map(([id,v])=>snapDoc(id,{...v})));
  const qFeatures=()=>snapQ(Object.entries(store.features).map(([id,v])=>snapDoc(id,{...v})));
  function emit(){ if(!loaded) return; clearTimeout(emitT); emitT=setTimeout(()=>{ const L=qLayouts(), F=qFeatures(); listeners.layouts.forEach(fn=>fn(L)); listeners.features.forEach(fn=>fn(F)); },0); }
  function setStatus(t){ const st=document.getElementById("status"); if(st){ st.textContent=t; st.classList.add("bad"); } }
  function persist(){ clearTimeout(persistT); persistT=setTimeout(()=>{
    const out={layouts:{},features:{}};
    for(const [id,l] of Object.entries(store.layouts)) if(l.draft) out.layouts[id]=l;
    for(const [id,f] of Object.entries(store.features)) if(store.layouts[f.layout]&&store.layouts[f.layout].draft) out.features[id]=f;
    try{ localStorage.setItem(DKEY,JSON.stringify(out)); }catch(e){ setStatus("Drafts can't be saved in this browser"); }
  },250); }
  function norm(f,layout){
    if(!f||typeof f!=="object"||!KINDS.has(f.kind)) return null;
    const key=String(f.key||"").replace(/[^A-Za-z0-9_.:-]/g,"").slice(0,80); if(!key) return null;
    const n=v=>{ const x=+v; return Number.isFinite(x)?x:0; };
    const o={layout,key,kind:f.kind,hole:(f.hole==null||f.hole==="")?null:Math.round(n(f.hole)),x:n(f.x),y:n(f.y),z:n(f.z)||946,label:String(f.label||"").slice(0,200),note:String(f.note||"").slice(0,4000)};
    if(f.kind==="tree") o.r=Math.max(3,Math.min(200,n(f.r)||15));
    if(typeof f.noteAt==="string") o.noteAt=f.noteAt.slice(0,40);
    return o;
  }
  const txt=(v,n)=>String(v==null?"":v).slice(0,n);
  const featsOf=id=>Object.values(store.features).filter(f=>f.layout===id);
  const newId=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  function hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return (h>>>0).toString(36); }
  function slug(name){ const d=new Date(); const ds=d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0");
    return (String(name||"draft").toLowerCase().replace(/\(my draft\)|\(shared\)/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40)||"draft")+"-"+ds; }

  // ---- published proposals from the repo's proposals/ folder
  async function listProposals(){
    const ck="bw-props-list";
    try{ const c=JSON.parse(sessionStorage.getItem(ck)||"null"); if(c&&Date.now()-c.t<600000) return c.list; }catch(e){}
    let list;
    try{
      const r=await fetch(`https://api.github.com/repos/${REPO}/contents/proposals?ref=${BRANCH}`,{headers:{Accept:"application/vnd.github+json"}});
      if(r.status===404) list=[]; else if(!r.ok) throw new Error(r.status);
      else list=(await r.json()).filter(x=>x&&x.type==="file"&&/\.json$/i.test(x.name)).map(x=>x.name);
    }catch(e){
      const r=await fetch("proposals/index.json",{cache:"no-cache"}).catch(()=>null);
      list=r&&r.ok?((await r.json()).files||[]).filter(n=>/\.json$/i.test(n)):[];
    }
    try{ sessionStorage.setItem(ck,JSON.stringify({t:Date.now(),list})); }catch(e){}
    return list;
  }
  async function loadProposals(){
    const list=await listProposals(); const out=[];
    await Promise.all(list.map(async name=>{ try{ const r=await fetch("proposals/"+encodeURIComponent(name),{cache:"no-cache"}); if(r.ok) out.push({name,doc:await r.json()}); }catch(e){} }));
    out.sort((a,b)=>String(a.doc.createdAt||"").localeCompare(String(b.doc.createdAt||"")));
    for(const {name,doc} of out){
      if(!doc||!Array.isArray(doc.features)) continue;
      const id="pub-"+name.replace(/\.json$/i,"").replace(/[^A-Za-z0-9_-]/g,"-").slice(0,60);
      store.layouts[id]={name:txt(doc.name||name,80),basedOn:store.layouts[doc.basedOn]?doc.basedOn:"current",clearedNotes:!!doc.clearedNotes,
        author:txt(doc.author,80),description:txt(doc.description,2000),createdAt:txt(doc.createdAt,40),published:true,file:name};
      doc.features.forEach(f=>{ const n=norm(f,id); if(n) store.features[id+"__"+n.key]=n; });
    }
  }

  // ---- share links: only the differences from the base layout, compressed
  async function pack(str){
    let bytes=new TextEncoder().encode(str), pre="1";
    if(typeof CompressionStream==="function"){ const cs=new Blob([bytes]).stream().pipeThrough(new CompressionStream("deflate-raw")); bytes=new Uint8Array(await new Response(cs).arrayBuffer()); pre="z"; }
    let bin=""; for(let i=0;i<bytes.length;i++) bin+=String.fromCharCode(bytes[i]);
    return pre+btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }
  async function unpack(s){
    const pre=s[0]; let b=s.slice(1).replace(/-/g,"+").replace(/_/g,"/"); while(b.length%4) b+="=";
    const bin=atob(b); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    if(pre==="z"){ const ds=new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw")); return new TextDecoder().decode(await new Response(ds).arrayBuffer()); }
    return new TextDecoder().decode(u);
  }
  const sk=o=>JSON.stringify(o,Object.keys(o).sort());
  function strip(f,clearNote){ const c={...f}; delete c.layout; if(clearNote){ c.note=""; delete c.noteAt; } return c; }
  async function shareUrl(id){
    const l=store.layouts[id]; const base=store.layouts[l.basedOn]?l.basedOn:"current"; const cleared=!!l.clearedNotes;
    const B={}; featsOf(base).forEach(f=>B[f.key]=f);
    const c=[], keys=new Set();
    featsOf(id).forEach(f=>{ keys.add(f.key); const b=B[f.key]; const s=strip(f,false); if(!b||sk(strip(b,cleared))!==sk(s)) c.push(s); });
    const payload={v:1,n:l.name||"",a:l.author||"",d:l.description||"",b:base,cn:cleared?1:0,c,r:Object.keys(B).filter(k=>!keys.has(k))};
    return location.origin+location.pathname+"#draft="+(await pack(JSON.stringify(payload)));
  }
  async function openFromHash(){
    const m=/^#draft=([A-Za-z0-9_-]+)$/.exec(location.hash); if(!m) return;
    history.replaceState(null,"",location.pathname+location.search);
    const sig=hash(m[1]);
    const have=Object.entries(store.layouts).find(([,l])=>l.draft&&l.sig===sig); if(have){ window.__PUBLIC_OPEN=have[0]; return; }
    const p=JSON.parse(await unpack(m[1])); if(!p||p.v!==1) return;
    const base=store.layouts[p.b]?p.b:"current", cleared=!!p.cn, id=newId("d");
    store.layouts[id]={name:txt(p.n||"Shared draft",70)+" (shared)",author:txt(p.a,80),description:txt(p.d,2000),basedOn:base,clearedNotes:cleared,createdAt:new Date().toISOString(),draft:true,sig};
    const removed=new Set((Array.isArray(p.r)?p.r:[]).map(String)), changed={};
    (Array.isArray(p.c)?p.c:[]).forEach(f=>{ const n=norm(f,id); if(n) changed[n.key]=n; });
    featsOf(base).forEach(f=>{ if(removed.has(f.key)||changed[f.key]) return; const c={...f,layout:id}; if(cleared){ c.note=""; delete c.noteAt; } store.features[id+"__"+f.key]=c; });
    Object.values(changed).forEach(f=>{ store.features[id+"__"+f.key]=f; });
    persist(); window.__PUBLIC_OPEN=id;
  }

  // ---- draft files
  function toFile(id){
    const l=store.layouts[id];
    return {format:"brockway-proposal/1",name:l.name||"Draft",author:l.author||"",description:l.description||"",basedOn:l.basedOn||"current",clearedNotes:!!l.clearedNotes,
      createdAt:l.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),features:featsOf(id).map(f=>strip(f,false))};
  }
  function download(id){
    const f=toFile(id); const blob=new Blob([JSON.stringify(f,null,1)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=slug(f.name)+".json"; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
  }
  function github(id){
    const f=toFile(id); const text=JSON.stringify(f,null,1); const path="proposals/"+slug(f.name)+".json";
    const prefilled=text.length<5000;
    const url=`https://github.com/${REPO}/new/${BRANCH}?filename=${encodeURIComponent(path)}`+(prefilled?"&value="+encodeURIComponent(text):"");
    return {text,path,url,prefilled};
  }
  function importText(t){
    const doc=JSON.parse(t); if(!doc||doc.format!=="brockway-proposal/1"||!Array.isArray(doc.features)) return null;
    const id=newId("d");
    store.layouts[id]={name:txt(doc.name||"Draft",70),author:txt(doc.author,80),description:txt(doc.description,2000),basedOn:store.layouts[doc.basedOn]?doc.basedOn:"current",
      clearedNotes:!!doc.clearedNotes,createdAt:new Date().toISOString(),draft:true};
    doc.features.forEach(f=>{ const n=norm(f,id); if(n) store.features[id+"__"+n.key]=n; });
    persist(); emit(); return id;
  }

  // ---- the store interface the planner calls
  function write(col,id,d){
    if(col==="features"){ const l=store.layouts[d&&d.layout]; if(!l||!l.draft) return Promise.resolve(); const n=norm(d,d.layout); if(!n) return Promise.resolve(); store.features[id]={...d,...n}; }
    else if(col==="layouts"){ const cur=store.layouts[id]; if(cur&&!cur.draft) return Promise.resolve(); store.layouts[id]={...d,draft:true}; }
    else return Promise.resolve();
    persist(); emit(); return Promise.resolve();
  }
  function remove(col,id){
    if(col==="features"){ const f=store.features[id]; if(f&&(!store.layouts[f.layout]||store.layouts[f.layout].draft)) delete store.features[id]; else return Promise.resolve(); }
    else if(col==="layouts"){ if(store.layouts[id]&&store.layouts[id].draft) delete store.layouts[id]; else return Promise.resolve(); }
    else return Promise.resolve();
    persist(); emit(); return Promise.resolve();
  }
  function collection(col){ return {
    onSnapshot(next){ const arr=col==="settings"?listeners.ground:listeners[col]; if(!arr) return ()=>{}; arr.push(next); if(loaded) setTimeout(()=>next(col==="layouts"?qLayouts():qFeatures()),0); return ()=>{ const i=arr.indexOf(next); if(i>=0) arr.splice(i,1); }; },
    doc(id){ return {
      set:d=>write(col,id,d), update:d=>write(col,id,{...(col==="features"?store.features[id]:store.layouts[id]),...d}), delete:()=>remove(col,id),
      get:()=>Promise.resolve(snapDoc(id,col==="settings"&&id==="ground"?store.ground:(col==="layouts"?store.layouts[id]:store.features[id]))),
      onSnapshot(next){ if(col==="settings"&&id==="ground"){ listeners.ground.push(next); if(loaded) setTimeout(()=>next(snapDoc(id,store.ground)),0); } return ()=>{}; }
    }; }
  }; }
  const db={collection,doc:p=>{ const [c,id]=p.split("/"); return collection(c).doc(id); }};
  const user={can:async()=>true,canEdit:async()=>false,isOwner:async()=>false};
  window.__PUBLIC={shareUrl,download,github,importText};
  window.claude={use:async n=>n==="db"?db:n==="user"?user:null};

  (async()=>{
    try{
      const r=await fetch("data/course.json",{cache:"no-cache"}); if(!r.ok) throw new Error(r.status);
      const data=await r.json();
      for(const [id,l] of Object.entries(data.layouts||{})) store.layouts[id]=l.locked?{...l}:{...l,published:true};
      for(const f of data.features||[]){ const n=norm(f,f.layout); if(n) store.features[f.layout+"__"+n.key]={...f,...n}; }
      store.ground=data.ground||null;
      const dt=new Date(data.exportedAt); window.__PUBLIC_DATE=isNaN(dt)?"":dt.toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
      window.__PUBLIC_DEFAULT=data.defaultLayout;
    }catch(e){ setStatus("Couldn't load the course data. Refresh to try again."); return; }
    try{ await Promise.race([loadProposals(),new Promise(res=>setTimeout(res,5000))]); }catch(e){}
    try{ const d=JSON.parse(localStorage.getItem(DKEY)||"null");
      if(d){ for(const [id,l] of Object.entries(d.layouts||{})) store.layouts[id]={...l,draft:true};
        for(const [id,f] of Object.entries(d.features||{})){ if(store.layouts[f.layout]&&store.layouts[f.layout].draft){ const n=norm(f,f.layout); if(n) store.features[id]={...f,...n}; } } } }catch(e){}
    try{ await openFromHash(); }catch(e){ setStatus("That share link couldn't be opened"); }
    loaded=true;
    const L=qLayouts(), F=qFeatures();
    listeners.layouts.forEach(fn=>fn(L)); listeners.features.forEach(fn=>fn(F)); listeners.ground.forEach(fn=>fn(snapDoc("ground",store.ground)));
  })();
})();
</script>
<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script>
(function(){
"use strict";
// ---------- reference data (UDisc Blue/Red layouts) ----------
const REF={1:{L:341,S:199,pL:3,pS:3},2:{L:414,S:null,pL:4,pS:3},3:{L:247,S:225,pL:3,pS:3},4:{L:214,S:null,pL:3,pS:3},
5:{L:250,S:149,pL:3,pS:3},6:{L:406,S:null,pL:4,pS:3},7:{L:641,S:416,pL:4,pS:4},8:{L:189,S:null,pL:3,pS:3},9:{L:254,S:230,pL:3,pS:3}};
const KIND={ "tee-long":{name:"Long tee",col:"--tee-long"}, "tee-short":{name:"Short tee",col:"--tee-short"},
  basket:{name:"Basket",col:null}, grade:{name:"Grade point",col:null}, tree:{name:"Tree",col:null} };

// ---------- state ----------
const S={ db:null, user:null, canWrite:true, layouts:{baseline:{name:"Baseline (current course)"}}, layout:"baseline",
  feats:{}, sel:null, mode:"select", tab:"inspect", exag:3, markerScale:3, contour:2, ground:null, loaded:false,
  confirmDel:false, newProp:false };
try{ const t=localStorage.getItem("bw-tab"); if(t) S.tab=t; const l=localStorage.getItem("bw-layout"); if(l) S.layout=l; }catch(e){}

const $=s=>document.querySelector(s);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=(n,d=0)=>(Math.round(n*10**d)/10**d).toFixed(d);
const sgn=(n,d=1)=>(n>0?"+":n<0?"−":"±")+fmt(Math.abs(n),d);
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,1800)}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

const UNLOCK={};
function lockable(l){ l=l||S.layout; return !!(S.layouts[l]&&S.layouts[l].locked); }
function locked(l){ l=l||S.layout; return lockable(l)&&!UNLOCK[l]; }
function setUnlock(on){ if(on) UNLOCK[S.layout]=true; else delete UNLOCK[S.layout]; if(!on) S.confirmDel=false;
  renderLayoutSel(); syncUndoBtns(); buildMarkers(); renderPane(); toast(on?"Editing the current course":"Current course is read-only again"); }
const PUBLIC=!!window.__PUBLIC;
function isPublished(l){ l=l||S.layout; return !!(S.layouts[l]&&S.layouts[l].published); }
function isDraft(l){ l=l||S.layout; return !!(S.layouts[l]&&S.layouts[l].draft); }
function editable(){ return S.canWrite&&!!S.db&&!locked()&&!isPublished(); }
function baseOf(l){ l=l||S.layout; if(lockable(l)) return null; const b=S.layouts[l]&&S.layouts[l].basedOn; return b&&b!==l&&S.layouts[b]?b:null; }
function layoutFeats(lay){return Object.values(S.feats).filter(f=>f.layout===lay)}
function cur(){return layoutFeats(S.layout)}
function docId(lay,key){return lay+"__"+key}

// ---------- write queue: one write at a time per doc, coalesced ----------
const pend={},busy={};
function save(f){ if(!S.db||!S.canWrite||locked(f.layout)||isPublished(f.layout)) return; const id=docId(f.layout,f.key); pend[id]={...f}; pump(id); }
async function pump(id){
  if(busy[id]||!pend[id]) return; busy[id]=true;
  const data=pend[id]; delete pend[id];
  try{ await S.db.collection("features").doc(id).set(data); }
  catch(e){ onWriteErr(e); }
  busy[id]=false; pump(id);
}
async function del(f){ if(!S.db||!S.canWrite||locked(f.layout)||isPublished(f.layout)) return; try{ await S.db.collection("features").doc(docId(f.layout,f.key)).delete(); }catch(e){onWriteErr(e)} }
function onWriteErr(e){
  if(e&&e.code==="invalid_argument"){S.canWrite=false; renderPane(); toast("You can view this plan but not edit it.");}
  else if(e&&e.code==="quota_exceeded") toast("The plan's storage is full. Delete unused proposals first.");
  else toast("Couldn't save that change. Try again in a moment.");
}
let saveTimers={};
function saveSoon(f){clearTimeout(saveTimers[f.key]);saveTimers[f.key]=setTimeout(()=>save(f),500)}

// ---------- three.js scene ----------
const canvas=$("#view");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,1,2,20000);
camera.up.set(0,1,0);
const controls=new THREE.OrbitControls(camera,canvas);
controls.enableDamping=true; controls.maxPolarAngle=Math.PI*0.49;
scene.add(new THREE.HemisphereLight(0xffffff,0x6b7a5c,0.85));
const sun=new THREE.DirectionalLight(0xffffff,0.55); sun.position.set(-400,800,300); scene.add(sun);

// world: X = east ft, Z = -north ft, Y = (elev - base) * exag
let BASE=946;
const W=(x,y,z)=>new THREE.Vector3(x,(z-BASE)*S.exag,-y);

// terrain
const TER={mesh:null,geo:null,ext:null,N:110};
const terMat=new THREE.ShaderMaterial({
  extensions:{derivatives:true},
  uniforms:{uMin:{value:940},uMax:{value:955},uInt:{value:2},uLight:{value:new THREE.Vector3(-0.4,0.8,0.3).normalize()},
    uTex:{value:null},uHasTex:{value:0},uOpac:{value:0.85},uTexC:{value:new THREE.Vector2()},uTexS:{value:new THREE.Vector2(1,1)},uRot:{value:0},
    uLine:{value:new THREE.Color(0x2c3a2e)}},
  vertexShader:`attribute float elev; varying float vE; varying vec3 vN; varying vec2 vP;
    void main(){ vE=elev; vN=normalize(normalMatrix*normal); vP=vec2(position.x,-position.z);
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader:`uniform float uMin,uMax,uInt,uHasTex,uOpac,uRot; uniform vec3 uLight,uLine; uniform sampler2D uTex; uniform vec2 uTexC,uTexS;
    varying float vE; varying vec3 vN; varying vec2 vP;
    vec3 ramp(float t){ vec3 a=vec3(0.36,0.50,0.33), b=vec3(0.60,0.70,0.45), c=vec3(0.82,0.80,0.58);
      return t<0.5? mix(a,b,t*2.0): mix(b,c,(t-0.5)*2.0); }
    void main(){
      float t=clamp((vE-uMin)/max(uMax-uMin,0.1),0.0,1.0);
      vec3 col=ramp(t);
      if(uHasTex>0.5){ vec2 d=vP-uTexC; float c=cos(-uRot), s=sin(-uRot); d=vec2(c*d.x-s*d.y, s*d.x+c*d.y);
        vec2 uv=d/uTexS+0.5; if(uv.x>0.0&&uv.x<1.0&&uv.y>0.0&&uv.y<1.0){ col=mix(col,texture2D(uTex,uv).rgb,uOpac);} }
      float l=0.55+0.45*max(dot(normalize(vN),uLight),0.0);
      col*=l;
      float e=vE/uInt; float w=fwidth(e); float f=abs(fract(e-0.5)-0.5)/max(w,1e-4);
      float line=1.0-min(f,1.0);
      float e5=vE/(uInt*5.0); float f5=abs(fract(e5-0.5)-0.5)/max(fwidth(e5),1e-4); float major=1.0-min(f5,1.0);
      col=mix(col,uLine,max(line*0.35,major*0.6));
      gl_FragColor=vec4(col,1.0);
    }`
});

function controlPts(){ return cur().filter(f=>f.kind!=="tree").map(f=>[f.x,f.y,f.z]); }
function elevAt(x,y,pts){
  pts=pts||controlPts(); if(!pts.length) return BASE;
  let sw=0,sz=0; for(const p of pts){const dx=x-p[0],dy=y-p[1];const d2=dx*dx+dy*dy;if(d2<0.01) return p[2];const w=1/(d2*d2/10000+d2*0.02+1);sw+=w;sz+=w*p[2];}
  return sz/sw;
}
function extent(){
  const fs=layoutFeats(baseOf()||S.layout).concat(cur());
  let a=[Infinity,-Infinity,Infinity,-Infinity];
  for(const f of fs){a[0]=Math.min(a[0],f.x);a[1]=Math.max(a[1],f.x);a[2]=Math.min(a[2],f.y);a[3]=Math.max(a[3],f.y);}
  if(!isFinite(a[0])) a=[-300,300,-300,300];
  const m=220; return [a[0]-m,a[1]+m,a[2]-m,a[3]+m];
}
function buildTerrain(){
  const ext=extent(); const N=TER.N;
  const same=TER.ext&&ext.every((v,i)=>Math.abs(v-TER.ext[i])<60);
  if(!same){
    if(TER.mesh){scene.remove(TER.mesh);TER.geo.dispose();}
    const w=ext[1]-ext[0], h=ext[3]-ext[2];
    const g=new THREE.PlaneGeometry(w,h,N,N); g.rotateX(-Math.PI/2); g.translate((ext[0]+ext[1])/2,0,-(ext[2]+ext[3])/2);
    g.setAttribute("elev",new THREE.BufferAttribute(new Float32Array(g.attributes.position.count),1));
    TER.geo=g; TER.mesh=new THREE.Mesh(g,terMat); TER.mesh.name="terrain"; scene.add(TER.mesh); TER.ext=ext;
  }
  const pts=controlPts(); const pos=TER.geo.attributes.position, el=TER.geo.attributes.elev;
  let mn=Infinity,mx=-Infinity;
  for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=-pos.getZ(i);const z=elevAt(x,y,pts);el.setX(i,z);pos.setY(i,(z-BASE)*S.exag);if(z<mn)mn=z;if(z>mx)mx=z;}
  pos.needsUpdate=true; el.needsUpdate=true; TER.geo.computeVertexNormals(); TER.geo.computeBoundingSphere();
  terMat.uniforms.uMin.value=mn; terMat.uniforms.uMax.value=mx; terMat.uniforms.uInt.value=S.contour;
}

// markers
const markers=new THREE.Group(); scene.add(markers);
const lines=new THREE.Group(); scene.add(lines);
const labelCache={};
function labelTex(txt,bg,fg){
  const k=txt+bg+fg; if(labelCache[k]) return labelCache[k];
  const F="700 40px 'Barlow Condensed', Arial Narrow, sans-serif";
  const m=document.createElement("canvas").getContext("2d"); m.font=F; const w=Math.max(56,Math.ceil(m.measureText(txt).width)+26);
  const CW=Math.max(128,w+8); const c=document.createElement("canvas"); c.width=CW;c.height=64; const x=c.getContext("2d"); x.font=F;
  x.fillStyle=bg; const r=14,X=(CW-w)/2; x.beginPath(); x.moveTo(X+r,6);x.arcTo(X+w,6,X+w,58,r);x.arcTo(X+w,58,X,58,r);x.arcTo(X,58,X,6,r);x.arcTo(X,6,X+w,6,r);x.fill();
  x.fillStyle=fg; x.textAlign="center"; x.textBaseline="middle"; x.fillText(txt,CW/2,34);
  const t=new THREE.CanvasTexture(c); t.anisotropy=4; t.userData={aspect:CW/64}; labelCache[k]=t; return t;
}
function sprite(txt,bg,fg,h){ const tx=labelTex(txt,bg,fg); const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tx,depthTest:false,sizeAttenuation:false}));
  s.scale.set(0.03*((tx.userData&&tx.userData.aspect)||2),0.03,1); s.renderOrder=10; s.userData.lh=h; return s; }
const mats={};
function mat(c){ if(!mats[c]) mats[c]=new THREE.MeshLambertMaterial({color:c}); return mats[c]; }
const selMat=new THREE.MeshBasicMaterial({color:0xd27a22,transparent:true,opacity:.9,side:THREE.DoubleSide});

function holeTarget(hole){ return cur().find(f=>f.kind==="basket"&&f.hole===hole); }

function buildMarkers(){
  const disp=o=>o.traverse(c=>{ if(c.geometry) c.geometry.dispose(); if(c.isSprite||c.isLine) c.material.dispose(); });
  disp(markers); disp(lines); markers.clear(); lines.clear();
  const k=S.markerScale; const fs=cur(); const pts=controlPts();
  const lc=css("--tee-long")||"#2d5ea8", sc=css("--tee-short")||"#c03f2c";
  for(const f of fs){
    const g=new THREE.Group(); g.userData.key=f.key; const p=W(f.x,f.y,f.z); g.position.copy(p);
    let top=6*k;
    if(f.kind==="tee-long"||f.kind==="tee-short"){
      const pad=new THREE.Mesh(new THREE.BoxGeometry(6*k*0.8,1.2,14*k*0.8),mat(f.kind==="tee-long"?lc:sc));
      pad.position.y=0.6; g.add(pad);
      const b=holeTarget(f.hole); if(b){ g.rotation.y=Math.atan2(b.x-f.x,b.y-f.y)*-1+Math.PI; }
      g.add(sprite(String(f.hole??"?")+(f.kind==="tee-long"?"L":"S"),f.kind==="tee-long"?lc:sc,"#fff",top));
      top=4*k;
    } else if(f.kind==="basket"){
      const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.25*k,0.25*k,5*k,8),mat("#8b8f8c")); pole.position.y=2.5*k; g.add(pole);
      const bowl=new THREE.Mesh(new THREE.CylinderGeometry(1.1*k,0.9*k,0.9*k,16),mat("#e9e4d2")); bowl.position.y=2.2*k; g.add(bowl);
      const band=new THREE.Mesh(new THREE.CylinderGeometry(1.15*k,1.15*k,0.35*k,16),mat("#e3b23c")); band.position.y=4.9*k; g.add(band);
      top=7*k; g.add(sprite("#"+(f.hole??"?"),"#1c2720","#f2f4ee",top));
    } else if(f.kind==="grade"){
      const c=new THREE.Mesh(new THREE.ConeGeometry(1.2*k,3*k,10),mat("#e3b23c")); c.position.y=1.5*k; c.rotation.x=Math.PI; c.position.y=1.5*k; g.add(c);
      top=3.5*k; g.add(sprite(f.label?f.label.slice(0,14):fmt(f.z,1)+"′","#e3b23c","#1c2720",top));
    } else if(f.kind==="tree"){
      const r=(f.r||15);
      const tr=new THREE.Mesh(new THREE.CylinderGeometry(0.8,1.1,10,8),mat("#6b4f35")); tr.position.y=5; g.add(tr);
      const cr=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),mat("#2f5b36")); cr.scale.y=0.8; cr.position.y=10+r*0.7; g.add(cr);
      top=10+r*1.5;
    }
    // hit target
    const hit=new THREE.Mesh(new THREE.CylinderGeometry(Math.max(5*k,f.kind==="tree"?(f.r||15):0),Math.max(5*k,f.kind==="tree"?(f.r||15):0),top,10),new THREE.MeshBasicMaterial({visible:false}));
    hit.position.y=top/2; hit.userData.key=f.key; g.add(hit); g.userData.hit=hit;
    if(S.sel===f.key){ const ring=new THREE.Mesh(new THREE.RingGeometry(7*k,8.5*k,40),selMat); ring.rotation.x=-Math.PI/2; ring.position.y=0.8; g.add(ring); }
    g.children.forEach(ch=>{ if(ch.isSprite) ch.position.y=ch.userData.lh+2; });
    if(f.kind.startsWith("tee")) g.children.forEach(ch=>{ if(ch.isSprite){ /* keep label upright regardless of rotation */ } });
    markers.add(g);
  }
  // fairway lines: tee -> basket, draped
  for(const f of fs){
    if(!f.kind.startsWith("tee")) continue; const b=holeTarget(f.hole); if(!b) continue;
    const arr=[]; const n=40; for(let i=0;i<=n;i++){const t=i/n;const x=f.x+(b.x-f.x)*t,y=f.y+(b.y-f.y)*t;const z=elevAt(x,y,pts);const v=W(x,y,z);v.y+=1.5;arr.push(v);}
    const geo=new THREE.BufferGeometry().setFromPoints(arr);
    const l=new THREE.Line(geo,new THREE.LineDashedMaterial({color:f.kind==="tee-long"?lc:sc,dashSize:8,gapSize:6,depthTest:true}));
    l.computeLineDistances(); lines.add(l);
  }
}
function rebuild(){ buildTerrain(); buildMarkers(); }

// ---------- undo / redo (per layout, this browser session) ----------
const HIST={}; // layout -> {u:[],r:[]}
const clone=o=>o?JSON.parse(JSON.stringify(o)):null;
function hist(l){ l=l||S.layout; return HIST[l]||(HIST[l]={u:[],r:[]}); }
function pushHist(layout,key,before,after,what,field){
  if(JSON.stringify(before)===JSON.stringify(after)) return;
  const h=hist(layout), top=h.u[h.u.length-1], now=Date.now();
  if(field&&top&&top.key===key&&top.field===field&&now-top.t<2000){ top.after=clone(after); top.t=now; }
  else { h.u.push({key,before:clone(before),after:clone(after),what,field,t:now}); if(h.u.length>200) h.u.shift(); }
  h.r=[]; syncUndoBtns();
}
function applyHist(e,state){
  const id=docId(S.layout,e.key); clearTimeout(saveTimers[e.key]);
  if(state){ S.feats[id]=clone(state); save(S.feats[id]); }
  else { const f=S.feats[id]; delete S.feats[id]; if(f) del(f); }
  S.sel=state?e.key:null; S.confirmDel=false; rebuild(); renderPane();
}
function undo(){ if(!editable()) return; const h=hist(), e=h.u.pop(); if(!e) return; applyHist(e,e.before); h.r.push(e); syncUndoBtns(); toast("Undid "+e.what); }
function redo(){ if(!editable()) return; const h=hist(), e=h.r.pop(); if(!e) return; applyHist(e,e.after); h.u.push(e); syncUndoBtns(); toast("Redid "+e.what); }
function syncUndoBtns(){ const h=hist(), ok=editable(); const u=$("#undoBtn"), r=$("#redoBtn"); if(!u) return;
  u.disabled=!ok||!h.u.length; r.disabled=!ok||!h.r.length;
  u.title=h.u.length?"Undo "+h.u[h.u.length-1].what+" (Ctrl+Z)":"Undo (Ctrl+Z)"; r.title=h.r.length?"Redo "+h.r[h.r.length-1].what+" (Ctrl+Shift+Z)":"Redo (Ctrl+Shift+Z)";
  const grp=u.parentElement; grp.hidden=!editable(); }
$("#undoBtn").onclick=undo; $("#redoBtn").onclick=redo;
document.addEventListener("keydown",ev=>{
  if(!(ev.ctrlKey||ev.metaKey)||ev.altKey) return;
  const k=ev.key.toLowerCase(); if(k!=="z"&&k!=="y") return;
  const a=document.activeElement; if(a&&(a.tagName==="TEXTAREA"||(a.tagName==="INPUT"&&/^(text|number|search)$/.test(a.type)))) return; // let fields undo their own typing
  ev.preventDefault(); if(k==="y"||ev.shiftKey) redo(); else undo();
});

// ---------- picking / dragging / adding ----------
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
let drag=null;
function setNdc(ev){const r=canvas.getBoundingClientRect(); ndc.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1); ray.setFromCamera(ndc,camera);}
function pickMarker(){ const hits=markers.children.map(g=>g.userData.hit).filter(Boolean); const h=ray.intersectObjects(hits,false)[0]; return h?h.object.userData.key:null; }
canvas.addEventListener("pointerdown",ev=>{
  if(ev.button!==0) return; setNdc(ev);
  const key=pickMarker();
  if(S.mode==="select"&&key){
    controls.enabled=false; const f=findKey(key);
    drag={key,start:[ev.clientX,ev.clientY],moved:false,plane:new THREE.Plane(new THREE.Vector3(0,1,0),-(f.z-BASE)*S.exag),orig:{x:f.x,y:f.y},before:clone(f)};
    canvas.setPointerCapture(ev.pointerId);

  } else { drag={key:null,start:[ev.clientX,ev.clientY],moved:false}; }
});
canvas.addEventListener("pointermove",ev=>{
  if(!drag) return;
  if(Math.hypot(ev.clientX-drag.start[0],ev.clientY-drag.start[1])>4) drag.moved=true;
  if(drag.key&&drag.moved&&editable()){
    setNdc(ev); const p=new THREE.Vector3(); if(ray.ray.intersectPlane(drag.plane,p)){
      const f=findKey(drag.key); f.x=Math.round(p.x*2)/2; f.y=Math.round(-p.z*2)/2;

});
canvas.addEventListener("pointerup",ev=>{
  const d=drag; drag=null; controls.enabled=true; if(!d) return;
  if(d.key&&d.moved&&editable()){ const f=findKey(d.key); save(f); pushHist(S.layout,f.key,d.before,f,"move of "+describe(f)); toast("Moved "+describe(f)); renderPane(); return; }
  if(!d.moved){

  }
});
function addAt(){
  if(!editable()){toast(locked()?"Current course is a read-only snapshot. Switch to Improvements to make changes.":"Editing isn't available for you on this plan.");return;}
  const h=ray.intersectObject(TER.mesh,false)[0]; if(!h) return;
  const x=Math.round(h.point.x), y=Math.round(-h.point.z); const z=Math.round(elevAt(x,y)*10)/10;
  const key="f-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  let hole=null; if(S.mode!=="grade"&&S.mode!=="tree"){ const sf=findKey(S.sel); hole=sf&&sf.hole?sf.hole:nextHole(); }
  const f={layout:S.layout,key,kind:S.mode,hole,x,y,z,note:"",label:""}; if(S.mode==="tree") f.r=15;
  S.feats[docId(S.layout,key)]=f; save(f); pushHist(S.layout,key,null,f,"adding "+describe(f)); select(key); setMode("select"); rebuild(); toast("Added "+describe(f));
}
function nextHole(){ const hs=cur().map(f=>f.hole||0); return Math.max(0,...hs)+1; }
function findKey(key){ return S.feats[docId(S.layout,key)]; }
function describe(f){ if(!f) return ""; const k=KIND[f.kind]?.name||f.kind; return (f.hole?("hole "+f.hole+" "):"")+k.toLowerCase(); }

function setMode(m){ if(!editable()&&m!=="select") m="select"; S.mode=m; document.querySelectorAll("#modeGrp button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.mode===m)));

}

// ---------- hole math ----------
function holeStats(lay){
  const fs=layoutFeats(lay); const holes={};
  for(const f of fs){ if(!f.hole) continue; (holes[f.hole]=holes[f.hole]||{}); if(f.kind==="basket") holes[f.hole].b=f; if(f.kind==="tee-long") holes[f.hole].L=f; if(f.kind==="tee-short") holes[f.hole].S=f; }
  const out=[]; for(const h of Object.keys(holes).map(Number).sort((a,b)=>a-b)){
    const o={hole:h,...holes[h]};
    for(const t of ["L","S"]){ if(o[t]&&o.b){ o[t+"d"]=Math.hypot(o.b.x-o[t].x,o.b.y-o[t].y); o[t+"e"]=o.b.z-o[t].z; } }
    out.push(o);
  } return out;
}

function renderPane(){
  const p=$("#pane");

  const ro= locked() ? `<div class="locknote"><b>Read-only</b><br>The course as it stands${L.snapshotAt?", recorded "+new Date(L.snapshotAt).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"}):""}. Open a proposal tab to see planned changes.${canUnlock?`<div class="inline" style="margin-top:8px"><button class="btn" type="button" id="unlockBtn">Edit current course</button><span class="delta">Use this to correct the record when the real course changes.</span></div>`:""}</div>`

    : isPublished() ? `<div class="locknote"><b>Published plan</b><br>${L.description?esc(L.description):"A proposal merged into the public site."}${L.author?" · Suggested by "+esc(L.author):""}${S.canWrite&&S.db?`<div class="inline" style="margin-top:8px"><button class="btn" type="button" id="copyDraftBtn">Copy to a draft</button><span class="delta">Make your own version to adjust.</span></div>`:""}</div>`

function when(iso){ try{ return new Date(iso).toLocaleString(undefined,{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}); }catch(e){ return ""; } }
function moveText(a,b){ const d=Math.hypot(b.x-a.x,b.y-a.y), dz=b.z-a.z; const p=[]; if(d>=0.5) p.push("moved "+fmt(d)+" ft "+bearing(a,b)); if(Math.abs(dz)>=0.05) p.push("elevation "+sgn(dz)+" ft"); return p.length?" — "+p.join(", "):" — unchanged"; }
function bearing(a,b){ const ang=(Math.atan2(b.x-a.x,b.y-a.y)*180/Math.PI+360)%360; return ["N","NE","E","SE","S","SW","W","NW"][Math.round(ang/45)%8]; }
function layName(l){ return S.layouts[l]?.name||l; }

  const tL=hs.reduce((a,h)=>a+(h.Ld||0),0), tS=hs.reduce((a,h)=>a+(h.Sd||0),0);

  <p class="sub" style="margin-top:12px">UDisc lists short tees for holes 2, 4, 6 and 8 only as a combined 759 ft, so those rows show no reference.</p>`;

function diff(){
  const bl=baseOf(); if(!bl||locked()) return null; const cleared=!!S.layouts[S.layout].clearedNotes;
  const A={},B={}; layoutFeats(bl).forEach(f=>A[f.key]=f); cur().forEach(f=>B[f.key]=f);
  const ch=[];
  for(const k in B){ const b=B[k], a=A[k];
    if(!a){ ch.push({type:"added",f:b}); continue; }
    const d=Math.hypot(b.x-a.x,b.y-a.y), dz=b.z-a.z, kind=a.kind!==b.kind, hole=a.hole!==b.hole, note=(b.note||"")!==(cleared?"":(a.note||""));
    if(d>=0.5||Math.abs(dz)>=0.05||kind||hole||note||(a.r||0)!==(b.r||0)) ch.push({type:"changed",f:b,a,d,dz,kind,hole,note});
  }
  for(const k in A) if(!B[k]) ch.push({type:"removed",f:A[k]});
  ch.sort((x,y)=>(x.f.hole||99)-(y.f.hole||99));
  return ch;
}
function changeLine(c){
  const f=c.f; const lab=f.label?" — "+f.label:""; const name=describe(f).replace(/^./,s=>s.toUpperCase())+lab;
  if(c.type==="added") return {t:"New "+describe(f)+lab,d:`at ${fmt(f.x)} E, ${fmt(f.y)} N, ${fmt(f.z,1)} ft`};
  if(c.type==="removed") return {t:"Remove "+describe(f),d:`was at ${fmt(f.x)} E, ${fmt(f.y)} N`};
  const p=[]; if(c.d>=0.5) p.push(`move ${fmt(c.d)} ft ${bearing(c.a,f)}`); if(Math.abs(c.dz)>=0.05) p.push(`${c.dz>0?"raise":"lower"} grade ${fmt(Math.abs(c.dz),1)} ft`);
  if(c.kind) p.push(`change from ${KIND[c.a.kind].name.toLowerCase()}`); if(c.hole) p.push(`renumber from hole ${c.a.hole}`); if(c.note&&!p.length) p.push("note added"+(f.noteAt?" "+when(f.noteAt):""));
  return {t:name,d:p.join(" · ")};
}
function summaryText(ch){
  const bl=baseOf(); const hsB=holeStats(bl), hsP=holeStats(S.layout);
  const lines=[`Brockway Park disc golf — change set: ${layName(S.layout)}`,`Compared with: ${layName(bl)}`,`Prepared: ${new Date().toLocaleDateString()}`,""];
  const tot=totals(ch);
  lines.push("TOTALS",`  Tee pads relocated: ${tot.teeMove}`,`  Baskets relocated: ${tot.bMove}`,`  New tee pads: ${tot.teeNew}   New baskets: ${tot.bNew}`,`  Items removed: ${tot.rem}`,`  Grade raised (fill) at ${tot.fillN} points, total ${fmt(tot.fill,1)} ft`,`  Grade lowered (cut) at ${tot.cutN} points, total ${fmt(tot.cut,1)} ft`,"");
  lines.push("CHANGES");
  for(const c of ch){ const l=changeLine(c); lines.push(`- ${l.t}: ${l.d}`); if(c.f.note) lines.push(`    Note${c.f.noteAt?" ("+when(c.f.noteAt)+")":""}: ${c.f.note}`); }
  lines.push("",`HOLE LENGTHS (ft, ${layName(bl).toLowerCase()} → proposed)`);
  const hs=new Set([...hsB,...hsP].map(h=>h.hole));
  [...hs].sort((a,b)=>a-b).forEach(h=>{ const b=hsB.find(x=>x.hole===h)||{}, p=hsP.find(x=>x.hole===h)||{};
    const f=(t)=>`${b[t+"d"]!=null?fmt(b[t+"d"]):"—"} → ${p[t+"d"]!=null?fmt(p[t+"d"]):"—"}`;
    lines.push(`  Hole ${h}: long ${f("L")}, short ${f("S")}`); });
  return lines.join("\n");
}
function totals(ch){
  const t={teeMove:0,bMove:0,teeNew:0,bNew:0,rem:0,fill:0,cut:0,fillN:0,cutN:0};
  for(const c of ch){ const tee=c.f.kind.startsWith("tee");
    if(c.type==="added"){ if(tee)t.teeNew++; else if(c.f.kind==="basket")t.bNew++; }
    else if(c.type==="removed") t.rem++;
    else { if(c.d>=0.5){ if(tee)t.teeMove++; else if(c.f.kind==="basket")t.bMove++; }
      if(c.dz>=0.05){t.fill+=c.dz;t.fillN++;} if(c.dz<=-0.05){t.cut-=c.dz;t.cutN++;} } }
  return t;

function revertChange(key){
  if(!editable()) return; const bl=baseOf(); if(!bl) return;
  const cleared=!!S.layouts[S.layout].clearedNotes;
  const a=S.feats[docId(bl,key)], b=findKey(key); const name=describe(b||a);
  let after=null; if(a){ after={...clone(a),layout:S.layout}; if(cleared){ after.note=""; delete after.noteAt; } }
  clearTimeout(saveTimers[key]);
  pushHist(S.layout,key,b||null,after,"revert of "+name);
  const id=docId(S.layout,key);
  if(after){ S.feats[id]=after; save(after); } else if(b){ delete S.feats[id]; del(b); if(S.sel===key) S.sel=null; }
  rebuild(); renderPane(); toast("Reverted "+name+" · Ctrl+Z brings it back");
}

// ---------- ground image ----------
let groundImg=null, gTimer=null, gBusy=false, gPend=false;
function saveGroundSoon(){ clearTimeout(gTimer); gTimer=setTimeout(saveGround,500); }
async function saveGround(){ if(!S.db||!S.canWrite) return; if(gBusy){gPend=true;return;} gBusy=true;
  try{ await S.db.collection("settings").doc("ground").set({...S.ground}); }catch(e){onWriteErr(e)} gBusy=false; if(gPend){gPend=false;saveGround();} }
async function uploadGround(e){
  const file=e.target.files[0]; if(!file) return;
  const assets=await window.claude?.use?.("assets").catch(()=>null);
  if(!assets){ toast("Image upload isn't available to you on this plan."); return; }
  toast("Uploading image…");
  try{ const r=await assets.upload(file); const ex=extent();
    S.ground={assetId:r.id,url:r.url,cx:Math.round((ex[0]+ex[1])/2),cy:Math.round((ex[2]+ex[3])/2),w:Math.round(ex[1]-ex[0]),rot:0,op:0.85,...(S.ground&&S.ground.url?{cx:S.ground.cx,cy:S.ground.cy,w:S.ground.w,rot:S.ground.rot,op:S.ground.op}:{})};
    S.ground.photo={id:r.id,url:r.url}; S.ground.show="photo"; delete S.ground.url; delete S.ground.assetId;
    applyGround(); await saveGround(); renderPane(); toast("Image added. Now line it up.");
  }catch(err){ toast("The image didn't upload. Try a PNG or JPG under 20 MB."); }
}
function applyGround(){
  const g0=S.ground; const u=terMat.uniforms;
  const url=g0?(g0.show==="none"?null:(g0[g0.show||"clean"]&&g0[g0.show||"clean"].url)||g0.url):null;
  if(!url){u.uHasTex.value=0;return;}
  const g={...g0,url};
  const set=()=>{ const ar=groundImg.height/groundImg.width; u.uTexC.value.set(g.cx,g.cy); u.uTexS.value.set(g.w,g.w*ar); u.uRot.value=g.rot*Math.PI/180; u.uOpac.value=g.op; u.uHasTex.value=1; };
  if(groundImg&&groundImg._url===g.url) return set();
  const img=new Image(); img.onload=()=>{ groundImg=img; img._url=g.url; const t=new THREE.Texture(img); t.needsUpdate=true; t.minFilter=THREE.LinearFilter; if(u.uTex.value) u.uTex.value.dispose(); u.uTex.value=t; set(); };
  img.onerror=()=>toast("The ground image couldn't be loaded."); img.src=g.url;
}

  const n=Object.keys(S.layouts).length;
  const box=document.createElement("span"); box.className="inline";
  box.innerHTML=`<input id="propName" type="text" value="Proposal ${n}" aria-label="Proposal name"><button class="btn primary" id="propOk" type="button">Create from ${esc(layName(S.layouts.current?"current":S.layout))}</button><button class="btn" id="propNo" type="button">Cancel</button>`;
  hdr.appendChild(box); $("#propName").select();
  $("#propNo").onclick=()=>box.remove();
  $("#propOk").onclick=async()=>{
    const name=$("#propName").value.trim()||("Proposal "+n); const id="p"+Date.now().toString(36);
    const from=S.layouts.current?"current":S.layout; const src=layoutFeats(from); box.remove();
    try{
      const meta={name,basedOn:from,clearedNotes:true,createdAt:new Date().toISOString()};
      await S.db.collection("layouts").doc(id).set(meta);
      S.layouts[id]={...meta,draft:PUBLIC}; S.layout=id; try{localStorage.setItem("bw-layout",id)}catch(x){}
      for(const f of src){ const c={...f,layout:id,note:""}; delete c.noteAt; S.feats[docId(id,f.key)]=c; save(c); }
      renderLayoutSel(); rebuild(); setTab("changes"); toast(`Created ${name}. Edits now go to the proposal.`);
    }catch(e){ onWriteErr(e); }
  };
});

// ---------- boot ----------
resize(); themeBg(); renderLayoutSel(); syncUndoBtns(); setupDraftFiles(); renderPane(); setMode("select"); buildTerrain(); frame("pers");
const st=$("#status");
function setStatus(t,bad){st.textContent=t;st.classList.toggle("bad",!!bad);}
(async()=>{
  const db=await (window.claude?.use?.("db")??Promise.resolve(null)).catch(()=>null);
  if(!db){ setStatus("Sign in to Claude to load the course",true); S.canWrite=false; renderPane(); renderLayoutSel(); return; }
  S.db=db;
  const user=await (window.claude?.use?.("user")??Promise.resolve(null)).catch(()=>null);
  if(user){ try{ const c=await user.can("data.write"); if(c===false) S.canWrite=false; }catch(e){} }
  renderLayoutSel(); renderPane();
  let timer=setTimeout(()=>setStatus("Can't reach saved data yet",true),10000);
  let first=true;
  db.collection("features").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer); setStatus(window.__PUBLIC_DATE?"Updated "+window.__PUBLIC_DATE:(S.canWrite?"Saved":"View only"));}
    const next={}; snap.docs.forEach(d=>{ const v=d.data(); if(v&&v.layout&&v.key) next[d.id]={...v}; });
    if(drag&&drag.key){ const id=docId(S.layout,drag.key); if(S.feats[id]) next[id]=S.feats[id]; }
    for(const id in pend) next[id]=pend[id];
    // keep focused input from being clobbered mid-typing
    const ae=document.activeElement; const typing=ae&&(ae.tagName==="TEXTAREA"||ae.tagName==="INPUT")&&S.tab==="inspect";
    S.feats=next;

    if(first){ first=false; const zs=Object.values(next).map(f=>f.z).filter(Number.isFinite); if(zs.length) BASE=Math.min(...zs)-2; rebuild(); frame("pers"); }
    else rebuild();
    if(!typing) renderPane(); else if(S.tab==="inspect") renderPaneLive();
  },err=>{clearTimeout(timer); setStatus("Saved data unavailable",true);});
  db.collection("layouts").onSnapshot(snap=>{
    const L={}; snap.docs.forEach(d=>{ const v=d.data(); if(v) L[d.id]={...v}; }); if(snap.docs.length) S.layouts=L;
    const vis=visibleLayouts();
    if(!vis.includes(S.layout)){ S.layout=(window.__PUBLIC_DEFAULT&&vis.includes(window.__PUBLIC_DEFAULT))?window.__PUBLIC_DEFAULT:(vis.includes("improvements")?"improvements":(vis[0]||"baseline")); S.sel=null; rebuild(); renderPane(); }
    if(window.__PUBLIC_OPEN&&S.layouts[window.__PUBLIC_OPEN]){ const oid=window.__PUBLIC_OPEN; window.__PUBLIC_OPEN=null; S.layout=oid; try{localStorage.setItem("bw-layout",oid)}catch(x){} S.sel=null; rebuild(); requestAnimationFrame(()=>frame("pers")); }
    renderLayoutSel(); syncUndoBtns(); const ae=document.activeElement; if(!(ae&&ae.closest&&ae.closest(".pane")&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))) renderPane();
  },()=>{});
  db.collection("settings").doc("ground").onSnapshot(d=>{ if(d.exists){ S.ground={...d.data()}; applyGround(); if(S.tab==="site"&&!(document.activeElement&&document.activeElement.closest&&document.activeElement.closest(".pane"))) renderPane(); } },()=>{});
})();
})();
</script>
